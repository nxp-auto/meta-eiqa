# /etc/default/ara2
# Board-specific configuration for Ara-2 NPU runtime.
# Adjust these values per your hardware module variant.

# Board type
ARA2_BOARD=willow

# DDR PLL setting: 1=1000MHz, 2=900MHz, 3=1066MHz
ARA2_DDR_PLL=3

# Path to DDR configuration binary
ARA2_DDR_CFG=/usr/share/ara2/ddr_config/ddr_cfg_35.bin

# Path to proxy configuration file
ARA2_PROXY_CONFIG=/etc/ara2/proxy_config.yaml
