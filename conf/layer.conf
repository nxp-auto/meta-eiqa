# We have a conf directory, add to BBPATH.
BBPATH .= ":${LAYERDIR}"

LICENSE_PATH:append = " ${LAYERDIR}/custom-licenses"
EIQAUTO_LICENSE = "${LAYERDIR}/custom-licenses/LA_OPT_NXP_Software_License"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS:append = " eiqa"
BBFILE_PATTERN_eiqa = "^${LAYERDIR}/"
BBFILE_PRIORITY_eiqa = "11"

LAYERSERIES_COMPAT_eiqa = "scarthgap"
