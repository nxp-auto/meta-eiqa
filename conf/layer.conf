# We have a conf directory, add to BBPATH.
BBPATH .= ":${LAYERDIR}"

LICENSE_PATH:append = " ${LAYERDIR}/custom-licenses"
EIQAUTO_LICENSE = "${LAYERDIR}/custom-licenses/LA_OPT_NXP_Software_License"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS:append = " eiqa"
BBFILE_PATTERN_eiqa = "^${LAYERDIR}/"
BBFILE_PRIORITY_eiqa = "11"

LAYERSERIES_COMPAT_eiqa = "scarthgap"

# Force NumPy 2.x distro-wide so every recipe builds against (and runs on) the
# NumPy 2.0 C-ABI. This avoids the "compiled with NumPy 1.x cannot run in 2.x"
# crash for any package with a compiled NumPy extension (e.g. onnxruntime).
PREFERRED_VERSION_python3-numpy = "2.2.3"
PREFERRED_VERSION_python3-numpy-native = "2.2.3"
PREFERRED_VERSION_nativesdk-python3-numpy = "2.2.3"
